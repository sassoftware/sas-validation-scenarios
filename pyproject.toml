[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sas-validation"
version = "0.1.0"
description = "SAS Viya validation scenario package tooling"
requires-python = ">=3.9"
dependencies = ["deepmerge>=2.0", "kubernetes>=29.0", "platformdirs>=4.0", "psutil>=5.9.4", "PyYAML>=6.0", "typer>=0.12"]

[project.optional-dependencies]
# Run workloads with Locust on this machine: sas-validation run --local
local = ["locust>=2.20", "locust-plugins[playwright]>=4.4", "playwright>=1.40", "python-dotenv>=1.0"]

[project.scripts]
sas-validation = "scenario_package.cli:app"

[tool.setuptools]
package-dir = {"" = "framework/python"}

[tool.setuptools.packages.find]
where = ["framework/python"]
