# Default repository for plugins install and plugins uninstall when --repo is omitted.
# Override it per command with --repo <alias>.
default-repository: platform-scenarios

# Plugin repository aliases used by the sas-validation plugins commands.
scenario-repositories:  
  platform-scenarios:
    provider: github-release
    repository: sassoftware/sas-validation-scenarios-platform
    visibility: public

